name: Verify
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard-ui
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard-ui/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Docker Official Images mirror avoids Docker Hub's shared-runner anonymous pull quota.
        image: public.ecr.aws/docker/library/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: durablejobs-test
          POSTGRES_DB: durablejobs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d durablejobs"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DURABLEJOBS_POSTGRES: Host=127.0.0.1;Port=5432;Database=durablejobs;Username=postgres;Password=durablejobs-test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard-ui/package-lock.json
      - run: ./scripts/verify.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: performance-smoke
          path: artifacts/performance/*.json
